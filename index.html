<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/cryptodust-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Inter: the CSS always asked for it, but it was never actually loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>CryptoDUST • Market Visualizer</title>
    <meta name="description" content="Immersive real-time cryptocurrency bubble visualization with ~600 coins, PulseChain ecosystem support, and live market data from CoinGecko." />
    <link rel="canonical" href="https://www.cryptodust.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cryptodust.xyz/" />
    <meta property="og:title" content="CryptoDUST • Market Visualizer" />
    <meta property="og:description" content="Immersive real-time cryptocurrency bubble visualization with ~600 coins, PulseChain ecosystem support, and live market data from CoinGecko." />
    <meta property="og:image" content="https://www.cryptodust.xyz/cryptodust-logo.png" />
    <meta property="og:site_name" content="CryptoDUST" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CryptoDUST • Market Visualizer" />
    <meta name="twitter:description" content="Immersive real-time cryptocurrency bubble visualization with ~600 coins, PulseChain ecosystem support, and live market data from CoinGecko." />
    <meta name="twitter:image" content="https://www.cryptodust.xyz/cryptodust-logo.png" />
  </head>
  <body class="bg-[#0a0a12] text-white overflow-hidden">
    <!-- Boot splash: replaced by React on mount. Avoids the black flash on first paint. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0a12;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #boot img { width: 56px; height: 56px; object-fit: contain; }
      #boot .wordmark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -1px;
        color: #f4f5f9;
      }
      #boot .wordmark span { color: #fb923c; }
      #boot .bar {
        width: 140px;
        height: 2px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #67f6ff, #a78bfa);
        animation: bootSlide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes bootSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
    <div id="root">
      <div id="boot">
        <img src="/cryptodust-logo.png" alt="" />
        <div class="wordmark">Crypto<span>DUST</span></div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
